[package]
name = "cashu-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "cashu-gateway"

[lib]
name = "cashu_gateway"
path = "src/lib.rs"

[[bin]]
name = "cashu-gateway"
path = "src/main.rs"

[[bin]]
name = "ldk-cli"
path = "src/bin/ldk-cli.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ldk-node = "0.7.0"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
cdk = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0-rc.2", default-features = false, features = ["wallet"] }
cdk-common = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0-rc.2" }
cdk-sqlite = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0-rc.2" }
cashu-gateway-protocol = { path = "../protocol" }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
cdk = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0-rc.2", default-features = false, features = ["wallet"] }
cdk-common = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0-rc.2" }
cdk-sqlite = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0-rc.2" }
cashu-gateway-protocol = { path = "../protocol" }
cashu-alice = { path = "../alice" }
